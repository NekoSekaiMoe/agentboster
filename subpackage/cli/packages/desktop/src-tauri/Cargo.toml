[package]
name = "agentboster-desktop"
version = "0.1.0"
description = "Agentboster Desktop - Tauri shell with computer use"
authors = ["Agentboster contributors"]
edition = "2021"

[lib]
name = "agentboster_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools", "macos-private-api"] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
which = "8"

# ── CLI auto-installer (download + extract) ────────────────────────
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
flate2 = "1"
tar = "0.4"
futures-util = "0.3"

# ── computer use (cross-platform) ─────────────────────────────────
# Screenshots (all platforms) — returns image::RgbaImage.
xcap = "0.9"
# Re-encode the captured image to PNG bytes.
image = { version = "0.25", default-features = false, features = ["png"] }
# Input injection (mouse + keyboard) — all platforms.
enigo = "0.6"

# Accessibility tree consumer. Per-platform backends are gated behind
# `#[cfg(target_os = ...)]` in computer_use.rs and only one is pulled in
# per build target.
#   Windows UIAutomation (COM client)
[target.'cfg(target_os = "windows")'.dependencies]
uiautomation = "0.25"

#   macOS Accessibility (AXUIElement C API)
[target.'cfg(target_os = "macos")'.dependencies]
accessibility-sys = "0.2"
core-foundation = "0.10"
core-foundation-sys = "0.8"

#   Linux AT-SPI (D-Bus accessibility)
[target.'cfg(target_os = "linux")'.dependencies]
atspi = "0.30"
zbus = { version = "5", default-features = false, features = ["tokio"] }
