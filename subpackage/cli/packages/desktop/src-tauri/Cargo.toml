[package]
name = "agentboster-desktop"
version = "0.1.0"
description = "Agentboster Desktop - Tauri shell with computer use"
authors = ["Agentboster contributors"]
edition = "2021"

[lib]
name = "agentboster_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools", "macos-private-api"] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
which = "8"

# ── CLI auto-installer (download + extract) ────────────────────────
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
flate2 = "1"
tar = "0.4"
futures-util = "0.3"
