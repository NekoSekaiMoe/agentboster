# CI for the agentboster desktop app (Tauri + Rust + Lit).
#
# The desktop package lives at subpackage/cli/packages/desktop/ but its
# upstream workflow at subpackage/cli/packages/desktop/.github/workflows/
# ci.yml is NOT picked up by GitHub Actions (only the repo-root
# .github/workflows/ is scanned). This file mirrors that ci.yml with the
# extra system deps each platform needs.
#
# Three matrix jobs validate Rust compilation per platform:
#   - Linux   (ubuntu-24.04): xcap PipeWire + enigo x11rb + atspi
#   - macOS    (macos-14):      xcap ScreenCaptureKit + enigo CGEvent
#   - Windows  (windows-latest): xcap DXGI + enigo SendInput + uiautomation
#
# The platform-specific AX backends are gated by #[cfg(target_os = ...)]
# so each job compiles only the code for its target.

name: desktop-ci

on:
  push:
    branches: [main]
    paths:
      - 'subpackage/cli/packages/desktop/**'
      - '.github/workflows/desktop-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'subpackage/cli/packages/desktop/**'
      - '.github/workflows/desktop-ci.yml'

permissions:
  contents: read

jobs:
  rust-check:
    name: cargo check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: subpackage/cli/packages/desktop/src-tauri

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        # Tauri 2 base deps + computer-use extras.
        # xcap needs libclang-dev + libxcb1-dev + libxrandr-dev + libpipewire-0.3-dev
        # at build time. enigo's x11rb backend needs libxcb1-dev.
        # Linux AT-SPI support needs libatspi2-dev + libdbus-1-dev.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config \
            libclang-dev \
            libxcb1-dev \
            libxrandr-dev \
            libxdo-dev \
            libdbus-1-dev \
            libatspi2.0-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libwayland-dev \
            libegl-dev

      - name: Rust check (cargo check)
        working-directory: subpackage/cli/packages/desktop
        run: cargo check --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}

  ts-check:
    name: TypeScript check (Linux)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install npm dependencies
        working-directory: subpackage/cli/packages/desktop
        run: npm install

      - name: TypeScript check
        working-directory: subpackage/cli/packages/desktop
        run: npm run check

      - name: Frontend build
        working-directory: subpackage/cli/packages/desktop
        run: npm run build:frontend
