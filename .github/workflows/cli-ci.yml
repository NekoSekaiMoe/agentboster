# Lint + typecheck + unit tests for the agentboster-cli package tree
# (subpackage/cli). Separate from build-all.yml because:
#  - build-all.yml produces release artifacts on three OSes; it's
#    heavyweight and only runs on main.
#  - cli-ci.yml gates PRs that touch the CLI on lint+test, which is
#    what catches regressions during development.
#
# Path filter excludes `subpackage/cli/packages/desktop/` because that
# package is gated by desktop-ci.yml (it has its own tsgo config and
# biome cache). Desktop changes therefore trigger desktop-ci only; CLI
# changes trigger cli-ci only; both run in parallel when a PR touches
# both.
#
# GitHub Actions paths filters don't support negation globs, so the
# positive list enumerates the CLI code locations explicitly.

name: cli-ci

on:
  push:
    branches: [main]
    paths:
      - 'subpackage/cli/packages/ai/**'
      - 'subpackage/cli/packages/agent/**'
      - 'subpackage/cli/packages/agentboster-adapter/**'
      - 'subpackage/cli/packages/coding-agent/**'
      - 'subpackage/cli/package.json'
      - 'subpackage/cli/yarn.lock'
      - 'subpackage/cli/biome.json'
      - 'subpackage/cli/tsconfig.json'
      - 'subpackage/cli/tsconfig.base.json'
      - '.github/workflows/cli-ci.yml'
  pull_request:
    paths:
      - 'subpackage/cli/packages/ai/**'
      - 'subpackage/cli/packages/agent/**'
      - 'subpackage/cli/packages/agentboster-adapter/**'
      - 'subpackage/cli/packages/coding-agent/**'
      - 'subpackage/cli/package.json'
      - 'subpackage/cli/yarn.lock'
      - 'subpackage/cli/biome.json'
      - 'subpackage/cli/tsconfig.json'
      - 'subpackage/cli/tsconfig.base.json'
      - '.github/workflows/cli-ci.yml'

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: biome + tsgo
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: subpackage/cli

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: subpackage/cli/yarn.lock

      - name: Install
        run: yarn install --frozen-lockfile

      # Mirrors `yarn check:lint` from subpackage/cli/package.json.
      # `--write` is intentional: biome auto-fixes safe issues here,
      # then tsgo does a pure typecheck. Errors still fail the job.
      - name: Biome + tsgo
        run: yarn check:lint

  test:
    name: vitest (coding-agent)
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: subpackage/cli

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: subpackage/cli/yarn.lock

      - name: Install
        run: yarn install --frozen-lockfile

      # Vitest is configured at the workspace root (subpackage/cli/) to
      # pick up tests from every package; see `vitest.config.ts`. Running
      # `yarn workspace @agentboster-cli/core test` invokes the coding-
      # agent package's test script, which is the suite that has tests.
      - name: Run unit tests
        run: yarn workspace @agentboster-cli/core test
