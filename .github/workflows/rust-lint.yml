# Rust linting for the desktop package.
#
# Runs cargo clippy and rustfmt --check on every push/PR that touches
# Rust source. Linux-only for clippy (platform AX backends are gated
# by #[cfg] so cross-platform check isn't needed for lint).
#
# Note: computer-use-mcp has migrated from Rust to Go and is now linted
# by computer-use-mcp-go-ci.yml. The old `computer-use-mcp` matrix entry
# and its path trigger were removed when the Rust source was dropped.

name: rust-lint

on:
  push:
    branches: [main]
    paths:
      - 'subpackage/cli/packages/desktop/src-tauri/**'
      - '.github/workflows/rust-lint.yml'
  pull_request:
    branches: [main]
    paths:
      - 'subpackage/cli/packages/desktop/src-tauri/**'
      - '.github/workflows/rust-lint.yml'

permissions:
  contents: read

jobs:
  clippy:
    name: clippy (${{ matrix.package }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: desktop
            manifest: subpackage/cli/packages/desktop/src-tauri/Cargo.toml

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.manifest }}

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config \
            libclang-dev \
            libxcb1-dev \
            libxrandr-dev \
            libxdo-dev \
            libdbus-1-dev \
            libatspi2.0-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libwayland-dev \
            libegl-dev \
            libgbm-dev

      - name: Prepare desktop resources placeholder
        # tauri.conf.json declares `bundle.resources: ["resources/*"]` and
        # tauri_build::build() validates that glob at build-script time,
        # which also runs under `cargo clippy`. The resources/ dir is
        # normally populated by prepare-resources.sh with real per-target
        # binaries; for lint we only need the directory to exist and be
        # non-empty so the glob matches. Mirrors desktop-ci.yml.
        if: matrix.package == 'desktop'
        working-directory: subpackage/cli/packages/desktop
        run: |
          mkdir -p src-tauri/resources
          touch src-tauri/resources/.gitkeep

      - name: cargo clippy
        run: cargo clippy --manifest-path ${{ matrix.manifest }} --all-targets -- -D warnings

  rustfmt:
    name: rustfmt (${{ matrix.package }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: desktop
            path: subpackage/cli/packages/desktop/src-tauri

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: cargo fmt --check
        working-directory: ${{ matrix.path }}
        run: cargo fmt --all -- --check
