# Unified release pipeline for agentboster's pre-built artifacts.
#
# Triggered by pushing a tag matching `v*` (e.g. `v0.1.0`). The tag name
# is the version shared across all components — there is one release per
# version with all artifacts attached, rather than per-component tags.
#
# What gets built (all in parallel, then collected by the `release` job):
#
#   agentd-a11y-helper-linux-amd64-<version>   (from subpackage/dbushelper, native)
#   agentd-a11y-helper-linux-arm64-<version>   (from subpackage/dbushelper, native)
#   agentd-linux-amd64-<version>              (from subpackage/agentd, native)
#   agentd-linux-arm64-<version>              (from subpackage/agentd, native)
#   agentboster-cli-<version>.tar.gz          (from subpackage/cli, OS-agnostic)
#   computer-use-mcp-darwin-arm64-<version>   (from subpackage/computer-use-mcp, native, zero CGo)
#   computer-use-mcp-windows-amd64-<version>.exe (from subpackage/computer-use-mcp, native, zero CGo)
#   computer-use-mcp-windows-arm64-<version>.exe (from subpackage/computer-use-mcp, native, zero CGo)
#   computer-use-mcp-linux-amd64-<version>    (from subpackage/computer-use-mcp, native, zero CGo)
#   computer-use-mcp-linux-arm64-<version>    (from subpackage/computer-use-mcp, native, zero CGo)
#
# All Go binaries are built on native runners (ubuntu-latest for amd64,
# ubuntu-24.04-arm for arm64) rather than cross-compiled. The build
# itself doubles as a per-arch smoke test (we exec the binary right
# after building), and each binary benefits from native toolchain
# behavior. godbus and agentd's Go deps are pure Go, so CGO stays at
# default — no C toolchain coupling.
#
# cli produces a single tarball (Node bundle, OS-agnostic) so it builds
# once on ubuntu-latest.
#
# This workflow is intentionally narrow: it builds and uploads release
# artifacts only. It does NOT run lint, tests, or any other CI step.
# Re-enabling releases does not imply re-enabling CI for the rest of the
# repo (which was turned off in commit 7583d49).

name: release

on:
  push:
    tags:
      - 'v*'
  # Manual runs verify the pipeline without tagging. The release-upload
  # step is guarded so manual runs only build, never upload.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label (e.g. v0.1.0-test). Used in asset names only; does NOT create or upload to a release.'
        required: false
        default: 'v0.1.0-dev'

permissions:
  contents: write   # required by gh release upload

jobs:
  # ── a11y-helper: native build on per-arch runners ────────────────

  a11y-helper:
    name: a11y-helper (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goarch: amd64
            asset_arch: amd64
          - runner: ubuntu-24.04-arm
            goarch: arm64
            asset_arch: arm64
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache-dependency-path: subpackage/dbushelper/go.sum

      - name: Resolve version
        id: ver
        # `github.event.inputs.version` is user-controlled (workflow_dispatch
        # caller) — interpolate it via env to avoid shell injection from the
        # `run:` body. `github.ref` is not user-controlled, so its expression
        # is safe to inline.
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="${INPUT_VERSION}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify native arch matches
        env:
          EXPECTED: ${{ matrix.goarch }}
        run: |
          ACTUAL="$(go env GOARCH)"
          echo "go env GOARCH = $ACTUAL, expected $EXPECTED"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Runner GOARCH ($ACTUAL) does not match matrix ($EXPECTED)"
            exit 1
          fi

      - name: Build
        working-directory: subpackage/dbushelper
        env:
          CGO_ENABLED: '0'
          GOOS: linux
        run: |
          mkdir -p ../../out
          go build -trimpath -ldflags="-s -w" \
            -o "../../out/agentd-a11y-helper-linux-${{ matrix.asset_arch }}-${{ steps.ver.outputs.version }}" \
            ./cmd/a11y-helper
          # Native smoke test: --help must exit 0 on every arch.
          "../../out/agentd-a11y-helper-linux-${{ matrix.asset_arch }}-${{ steps.ver.outputs.version }}" --help

      - uses: actions/upload-artifact@v7
        with:
          name: agentd-a11y-helper-linux-${{ matrix.asset_arch }}-${{ steps.ver.outputs.version }}
          path: out/agentd-a11y-helper-linux-${{ matrix.asset_arch }}-${{ steps.ver.outputs.version }}
          retention-days: 14
          if-no-files-found: error

  # ── agentd: native build on per-arch runners ──────────────────────

  agentd:
    name: agentd (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goarch: amd64
            asset_arch: amd64
          - runner: ubuntu-24.04-arm
            goarch: arm64
            asset_arch: arm64
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache-dependency-path: subpackage/agentd/go.sum

      - name: Resolve version
        id: ver
        # `github.event.inputs.version` is user-controlled (workflow_dispatch
        # caller) — interpolate it via env to avoid shell injection from the
        # `run:` body. `github.ref` is not user-controlled, so its expression
        # is safe to inline.
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="${INPUT_VERSION}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify native arch matches
        env:
          EXPECTED: ${{ matrix.goarch }}
        run: |
          ACTUAL="$(go env GOARCH)"
          echo "go env GOARCH = $ACTUAL, expected $EXPECTED"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Runner GOARCH ($ACTUAL) does not match matrix ($EXPECTED)"
            exit 1
          fi

      - name: Build
        working-directory: subpackage/agentd
        env:
          # agentd is Linux-only (//go:build linux). CGO is not used but
          # we leave the default so the runner's C toolchain is available
          # if a future dependency adds cgo.
          GOOS: linux
        run: |
          mkdir -p ../../out
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          go build -trimpath \
            -ldflags="-s -w -X main.version=${{ steps.ver.outputs.version }} -X main.buildTime=${BUILD_TIME}" \
            -o "../../out/agentd-linux-${{ matrix.asset_arch }}-${{ steps.ver.outputs.version }}" \
            ./cmd/agentd
          # Native smoke test: -gen-certs writes to a temp dir and exits
          # 0 without needing a config file. Verifies the binary actually
          # runs on this arch.
          cd ../../out
          "./agentd-linux-${{ matrix.asset_arch }}-${{ steps.ver.outputs.version }}" -gen-certs -cert-dir /tmp/agentd-certs-test

      - uses: actions/upload-artifact@v7
        with:
          name: agentd-linux-${{ matrix.asset_arch }}-${{ steps.ver.outputs.version }}
          path: out/agentd-linux-${{ matrix.asset_arch }}-${{ steps.ver.outputs.version }}
          retention-days: 14
          if-no-files-found: error

  # ── computer-use-mcp: native build on 5 targets (zero CGo) ───────
  #
  # Cross-platform MCP server (Linux/macOS/Windows) for computer use
  # — screenshots, input simulation, a11y trees, clipboard, recording.
  # Pure Go: no CGo anywhere (platform FFI via purego / x/sys; verified
  # by `grep -r 'import "C"' subpackage/computer-use-mcp` returning
  # nothing). So CGO_ENABLED=0 yields static binaries with no system
  # libc coupling, exactly like a11y-helper.
  #
  # Targets mirror the desktop job's runner matrix (macos-26 arm64,
  # windows-latest amd64, windows-11-arm arm64, ubuntu-latest amd64,
  # ubuntu-24.04-arm arm64). Each builds natively — no cross-compile.
  #
  # The binary is a stdio MCP server with no --help / -version flag
  # (main.go goes straight into server.ServeStdio), so unlike a11y-helper
  # (`--help`) or agentd (`-gen-certs`) we can't run a quick subcommand
  # smoke test. Instead the native `go vet` + `go build` IS the per-arch
  # smoke test (success proves compile+link on this arch/OS), and
  # `go version -m <binary>` asserts the artifact is a well-formed Go
  # binary with build metadata. Go's own toolchain gate is the signal
  # here; a botched cross-arch would fail at link time.

  computer-use-mcp:
    name: computer-use-mcp (${{ matrix.asset_target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            goos: darwin
            goarch: arm64
            asset_target: darwin-arm64
            ext: ''
          - runner: windows-latest
            goos: windows
            goarch: amd64
            asset_target: windows-amd64
            ext: '.exe'
          - runner: windows-11-arm
            goos: windows
            goarch: arm64
            asset_target: windows-arm64
            ext: '.exe'
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            asset_target: linux-amd64
            ext: ''
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            asset_target: linux-arm64
            ext: ''
    # run: blocks default to PowerShell on windows-* runners; force bash
    # (Git Bash is preinstalled on GHA Windows images) so the build
    # script is identical across all 5 targets.
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          # go.mod declares `go 1.25.5`; go-version-file picks the right
          # toolchain without hardcoding (matches computer-use-mcp-go-ci.yml).
          go-version-file: subpackage/computer-use-mcp/go.mod
          cache-dependency-path: subpackage/computer-use-mcp/go.sum

      - name: Resolve version
        id: ver
        # `github.event.inputs.version` is user-controlled (workflow_dispatch
        # caller) — interpolate it via env to avoid shell injection from the
        # `run:` body. `github.ref` is not user-controlled, so its expression
        # is safe to inline.
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="${INPUT_VERSION}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify native arch matches
        env:
          EXPECTED: ${{ matrix.goarch }}
        run: |
          ACTUAL="$(go env GOARCH)"
          echo "go env GOARCH = $ACTUAL, expected $EXPECTED"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Runner GOARCH ($ACTUAL) does not match matrix ($EXPECTED)"
            exit 1
          fi

      - name: Build
        working-directory: subpackage/computer-use-mcp
        env:
          # Zero CGo by design (purego / x/sys); static binary, no libc
          # coupling. Mirrors a11y-helper. If this ever fails the build,
          # it means someone added `import "C"" — that's the real bug.
          CGO_ENABLED: '0'
        run: |
          mkdir -p ../../out
          # vet is a cheap per-arch signal that the platform-tagged
          # files for this GOOS compile cleanly (unsafeptr handling in
          # the syscall code is GOOS-specific).
          go vet ./...
          go build -trimpath -ldflags="-s -w" \
            -o "../../out/computer-use-mcp-${{ matrix.asset_target }}-${{ steps.ver.outputs.version }}${{ matrix.ext }}" \
            ./cmd/server
          cd ../../out
          # Assert the artifact is a well-formed Go binary with build
          # metadata. `go version -m` parses the buildinfo embedded by
          # the linker and works cross-OS (parses a darwin Mach-O /
          # windows PE from any host). A botched link would fail here.
          go version -m "computer-use-mcp-${{ matrix.asset_target }}-${{ steps.ver.outputs.version }}${{ matrix.ext }}"

      - uses: actions/upload-artifact@v7
        with:
          name: computer-use-mcp-${{ matrix.asset_target }}-${{ steps.ver.outputs.version }}
          path: out/computer-use-mcp-${{ matrix.asset_target }}-${{ steps.ver.outputs.version }}${{ matrix.ext }}
          retention-days: 14
          if-no-files-found: error

  # ── cli: single tarball (Node bundle is OS-agnostic) ──────────────

  cli:
    name: cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          # cli/AGENTS.md pins engines.node >=22.19.0. setup-node's
          # node-version is the runner's Node binary used for yarn.
          node-version: '22'
          cache: yarn
          cache-dependency-path: subpackage/cli/yarn.lock

      - name: Resolve version
        id: ver
        # `github.event.inputs.version` is user-controlled (workflow_dispatch
        # caller) — interpolate it via env to avoid shell injection from the
        # `run:` body. `github.ref` is not user-controlled, so its expression
        # is safe to inline.
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="${INPUT_VERSION}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install
        working-directory: subpackage/cli
        run: yarn install --frozen-lockfile

      - name: Build
        working-directory: subpackage/cli
        run: yarn build

      - name: Bundle
        working-directory: subpackage/cli
        run: yarn bundle

      - name: Package
        working-directory: subpackage/cli
        env:
          # package.mjs reads this to name the tarball; falls back to
          # packages/coding-agent/package.json's version when unset.
          # Tagged releases carry the tag name (e.g. v0.1.3) so the
          # asset is agentboster-cli-v0.1.3.tar.gz rather than the
          # hardcoded 0.1.0 from package.json.
          AGENTBOSTER_CLI_VERSION: ${{ steps.ver.outputs.version }}
        run: yarn package

      - name: Locate tarball
        id: tarball
        working-directory: subpackage/cli
        run: |
          TARBALL=$(ls -1 agentboster-cli-*.tar.gz | head -1)
          if [ -z "$TARBALL" ]; then
            echo "::error::No agentboster-cli-*.tar.gz found after yarn package"
            exit 1
          fi
          mkdir -p ../../out
          cp "$TARBALL" "../../out/$TARBALL"
          echo "name=$TARBALL" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.tarball.outputs.name }}
          path: out/${{ steps.tarball.outputs.name }}
          retention-days: 14
          if-no-files-found: error

  # ── desktop: Tauri 2 app on 5 native targets ──────────────────────
  #
  # Tauri must build on a runner whose OS+arch matches the target — it
  # shells out to platform-specific bundlers (appdmg, makensis, wix,
  # appimage). We build natively on each runner rather than cross-compiling.
  #
  #   macos-26          → macOS arm64       (.dmg, .app.tar.gz)
  #   windows-latest    → Windows x64       (.exe NSIS, .msi)
  #   windows-11-arm    → Windows arm64     (.exe NSIS, .msi)
  #   ubuntu-latest     → Linux x64         (.AppImage, .deb)
  #   ubuntu-24.04-arm  → Linux arm64       (.AppImage, .deb)
  #
  # Note: GitHub has no `windows-2025-arm` image (verified against
  # actions/runner-images); windows-11-arm is the only GA Windows ARM64
  # runner. Each runner's native arch matches the Rust target, so no
  # cross-compile / --target flag is needed.
  #
  # Each runner uploads one artifact named `desktop-<asset_target>`; the
  # release job downloads them all and uploads the files to the GH release.
  # Desktop artifacts are NOT in the release job's strict EXPECTED list
  # because their filenames embed version + arch in platform-specific
  # shapes (spaces, mixed casing) that are fragile to enumerate. Instead
  # the release job does a per-target glob presence check.

  desktop:
    name: desktop (${{ matrix.asset_target }})
    needs: [cli, computer-use-mcp]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # asset_target  — release asset label + staged dir name
          # mcp_artifact  — upload-artifact name from the computer-use-mcp job
          #                 (uses GNU arch names: amd64/arm64)
          # rust_target   — Rust triple prepare-resources.sh writes and
          #                 discover_sidecar (lib.rs) searches for. Mapped
          #                 here once so no string surgery at runtime.
          - runner: macos-26
            asset_target: macos-arm64
            mcp_artifact: computer-use-mcp-darwin-arm64-${{ github.event.inputs.version || github.ref_name }}
            rust_target: aarch64-apple-darwin
          - runner: windows-latest
            asset_target: windows-x64
            mcp_artifact: computer-use-mcp-windows-amd64-${{ github.event.inputs.version || github.ref_name }}
            rust_target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            asset_target: windows-arm64
            mcp_artifact: computer-use-mcp-windows-arm64-${{ github.event.inputs.version || github.ref_name }}
            rust_target: aarch64-pc-windows-msvc
          - runner: ubuntu-latest
            asset_target: linux-x64
            mcp_artifact: computer-use-mcp-linux-amd64-${{ github.event.inputs.version || github.ref_name }}
            rust_target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            asset_target: linux-arm64
            mcp_artifact: computer-use-mcp-linux-arm64-${{ github.event.inputs.version || github.ref_name }}
            rust_target: aarch64-unknown-linux-gnu

    defaults:
      run:
        working-directory: subpackage/cli/packages/desktop

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          # desktop ships yarn.lock (not package-lock.json); cache against it.

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: subpackage/cli/packages/desktop/src-tauri

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        # Mirrors desktop-ci.yml. xcap needs PipeWire + libclang; enigo's
        # x11rb backend needs libxcb1; AT-SPI needs libatspi2 + libdbus.
        # xdg-utils provides /usr/bin/xdg-open, which Tauri's AppImage
        # bundler symlinks into the AppDir (AppImage runtime uses it to
        # open URLs/files).
        # libfuse2 is required to RUN linuxdeploy (itself an AppImage):
        # Ubuntu 24.04 images no longer preinstall it — notably the
        # ubuntu-24.04-arm image, where its absence fails AppImage
        # bundling with a bare "failed to run linuxdeploy" (deb/rpm are
        # unaffected, which is exactly the failure signature). On noble
        # the real package is libfuse2t64; libfuse2 exists only as a
        # transitional alias on some images, so try both.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config \
            libclang-dev \
            libxcb1-dev \
            libxrandr-dev \
            libxdo-dev \
            libdbus-1-dev \
            libatspi2.0-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libwayland-dev \
            libegl-dev \
            libgbm-dev \
            xdg-utils
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2

      - name: Install npm dependencies
        # desktop ships yarn.lock (not package-lock.json); use yarn to
        # honor the committed lockfile.
        run: yarn install --frozen-lockfile

      - name: Resolve version
        id: ver
        shell: bash
        # `github.event.inputs.version` is user-controlled (workflow_dispatch
        # caller) — interpolate it via env to avoid shell injection from the
        # `run:` body. `github.ref` is not user-controlled, so its expression
        # is safe to inline. See security hardening guide:
        # https://docs.github.com/actions/security-guides/security-hardening-for-github-actions#using-an-intermediate-environment-variable
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="${INPUT_VERSION}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download MCP binary
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.mcp_artifact }}
          # actions/* `path` inputs resolve relative to GITHUB_WORKSPACE
          # (repo root), NOT relative to this job's
          # defaults.run.working-directory (…/packages/desktop). The
          # `mv` step below runs with cwd=…/packages/desktop and globs
          # `sidecar-stage/mcp-in/*` against that cwd, so we must
          # download INTO the desktop dir via an absolute path —
          # otherwise the file lands at <root>/sidecar-stage/mcp-in/
          # and the glob matches nothing ("No such file or directory").
          path: ${{ github.workspace }}/subpackage/cli/packages/desktop/sidecar-stage/mcp-in
      - name: Download CLI tarball
        uses: actions/download-artifact@v8
        with:
          name: agentboster-cli-${{ steps.ver.outputs.version }}.tar.gz
          path: ${{ github.workspace }}/subpackage/cli/packages/desktop/sidecar-stage/cli-in
      - name: Normalize + extract sidecars
        shell: bash
        env:
          MCP_BIN_NAME: ${{ contains(matrix.rust_target, 'windows') && 'computer-use-mcp.exe' || 'computer-use-mcp' }}
        # cwd is .../packages/desktop (defaults.run.working-directory).
        # download-artifact landed files under sidecar-stage/{mcp,cli}-in/
        # relative to cwd, so we normalize in place there.
        run: |
          set -euo pipefail
          mkdir -p sidecar-stage/mcp sidecar-stage/cli

          # MCP: rename the version/arch-stamped binary to the bare name.
          # download-artifact flattens into mcp-in/ with the original
          # uploaded filename; there's exactly one file there.
          mv sidecar-stage/mcp-in/* "sidecar-stage/mcp/$MCP_BIN_NAME"
          test -f "sidecar-stage/mcp/$MCP_BIN_NAME"
          echo "Staged MCP: $(ls -la sidecar-stage/mcp/)"

          # CLI tarball is OS-agnostic (single agentboster-cli-<ver>.tar.gz).
          # Layout is agentboster-cli-<ver>/{agentboster-cli, agentboster-cli.cjs}.
          # --strip-components=1 flattens that top dir so the wrapper + .cjs
          # land directly at the top of CLI_STAGED_DIR, which is what
          # prepare-resources.sh scans.
          TARBALL="$(ls sidecar-stage/cli-in/agentboster-cli-*.tar.gz | head -1)"
          tar -xzf "$TARBALL" --strip-components=1 -C sidecar-stage/cli
          test -f sidecar-stage/cli/agentboster-cli.cjs
          echo "Staged CLI: $(ls -la sidecar-stage/cli/)"

      - name: Build Tauri app
        # `tauri build` runs beforeBuildCommand (bash scripts/prepare-resources.sh
        # && yarn build:frontend) which reads ARTIFACT_DIR + CLI_STAGED_DIR +
        # TARGET to populate src-tauri/resources/ with the staged MCP + CLI
        # sidecars, then compiles the Rust binary and runs platform bundlers.
        # Output lands in src-tauri/target/release/bundle/.
        env:
          # Absolute paths so prepare-resources.sh's `cp` works regardless
          # of the working directory tauri invokes beforeBuildCommand from.
          # stage/ lives under packages/desktop/.
          ARTIFACT_DIR: ${{ github.workspace }}/subpackage/cli/packages/desktop/sidecar-stage/mcp
          CLI_STAGED_DIR: ${{ github.workspace }}/subpackage/cli/packages/desktop/sidecar-stage/cli
          TARGET: ${{ matrix.rust_target }}
          # linuxdeploy and the appimage plugin are themselves AppImages;
          # this makes them extract-and-run instead of FUSE-mounting, so
          # bundling works even if the runner kernel/FUSE setup can't
          # mount AppImages (belt-and-suspenders alongside libfuse2).
          # Harmless on macOS/Windows — no AppImage tooling runs there.
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: npm run build
        continue-on-error: true

      - name: Stage bundle artifacts (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          STAGE="../../../../desktop-out/${{ matrix.asset_target }}"
          mkdir -p "$STAGE"
          BUNDLE_DIR="src-tauri/target/release/bundle"
          # Collect every installer file Tauri emits (.dmg, .app.tar.gz,
          # .AppImage, .deb). Plain `find ... -exec cp {} +` with -t fails
          # on macOS BSD find, so we loop.
          find "$BUNDLE_DIR" -type f \
            \( -name '*.dmg' -o -name '*.app.tar.gz' \
               -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) \
            -print0 | while IFS= read -r -d '' f; do
              cp "$f" "$STAGE/"
            done
          echo "=== staged ${{ matrix.asset_target }} ==="
          ls -la "$STAGE"

      - name: Stage bundle artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = "../../../../desktop-out/${{ matrix.asset_target }}"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          $bundleDir = "src-tauri/target/release/bundle"
          # NSIS emits *-setup.exe; WiX emits .msi. Collect both.
          $files = Get-ChildItem -Path $bundleDir -Recurse -File |
            Where-Object { $_.Extension -in '.msi','.exe' }
          foreach ($f in $files) {
            Copy-Item $f.FullName -Destination $stage
          }
          Write-Host "=== staged ${{ matrix.asset_target }} ==="
          Get-ChildItem $stage | Format-Table Name,Length

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.asset_target }}
          path: desktop-out/${{ matrix.asset_target }}
          retention-days: 14
          if-no-files-found: error

  # ── release: collect all artifacts, attach to the GitHub release ──

  release:
    name: attach to release
    needs: [a11y-helper, agentd, cli, computer-use-mcp, desktop]
    runs-on: ubuntu-latest
    # Only attach when triggered by a real tag push. workflow_dispatch
    # runs verify the pipeline but must not pollute any release with
    # dev-labeled artifacts.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve version
        id: ver
        run: |
          VERSION="${GITHUB_REF_NAME}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          # Match every artifact produced by the build jobs. The pattern
          # is intentionally broad — we want the release to fail loudly
          # if any expected asset is missing.
          path: release-assets
          # merge-multiple flattens the per-artifact subdirectories that
          # download-artifact v4+ creates by default. Without this, the
          # layout is release-assets/<artifact-name>/<file> and our
          # subsequent verifications would need to know each subdir name.
          # With it, every file lands directly in release-assets/.
          merge-multiple: true

      - name: Verify expected assets present
        run: |
          chmod +x release-assets/agentd-* || true

          echo "=== Collected release assets ==="
          ls -la release-assets/

          EXPECTED=(
            "agentd-a11y-helper-linux-amd64-${{ steps.ver.outputs.version }}"
            "agentd-a11y-helper-linux-arm64-${{ steps.ver.outputs.version }}"
            "agentd-linux-amd64-${{ steps.ver.outputs.version }}"
            "agentd-linux-arm64-${{ steps.ver.outputs.version }}"
            "agentboster-cli-${{ steps.ver.outputs.version }}.tar.gz"
            "computer-use-mcp-darwin-arm64-${{ steps.ver.outputs.version }}"
            "computer-use-mcp-windows-amd64-${{ steps.ver.outputs.version }}.exe"
            "computer-use-mcp-windows-arm64-${{ steps.ver.outputs.version }}.exe"
            "computer-use-mcp-linux-amd64-${{ steps.ver.outputs.version }}"
            "computer-use-mcp-linux-arm64-${{ steps.ver.outputs.version }}"
          )
          MISSING=0
          for ASSET in "${EXPECTED[@]}"; do
            if [ ! -e "release-assets/$ASSET" ]; then
              echo "::error::Missing release asset: $ASSET"
              MISSING=$((MISSING + 1))
            fi
          done

          # Desktop artifacts have version- and arch-embedded filenames in
          # platform-specific shapes (spaces, mixed casing), so we can't
          # enumerate them like the Go/CLI assets. Instead assert that each
          # of the 5 desktop targets contributed at least one installer
          # matching its platform's extension.
          echo "=== Desktop asset presence check ==="
          DESKTOP_MISSING=0
          check_glob() {
            local label="$1"; local pattern="$2"
            # shellcheck disable=SC2086
            if [ -z "$(ls release-assets/$pattern 2>/dev/null)" ]; then
              echo "::error::Missing desktop assets for $label (pattern: $pattern)"
              DESKTOP_MISSING=$((DESKTOP_MISSING + 1))
            else
              echo "  $label: $(ls release-assets/$pattern 2>/dev/null | wc -l) file(s)"
            fi
          }
          # macOS: dmg from macos-arm64
          check_glob "macos-arm64" "*.dmg"
          # Windows: NSIS setup .exe from windows-x64 + windows-arm64
          check_glob "windows-x64+arm64 (nsis)" "*-setup.exe"
          # Windows: .msi from both windows targets
          check_glob "windows-x64+arm64 (msi)" "*.msi"
          # Linux: AppImage + deb from linux-x64 + linux-arm64
          check_glob "linux-x64+arm64 (appimage)" "*.AppImage"
          check_glob "linux-x64+arm64 (deb)" "*.deb"

          TOTAL_MISSING=$((MISSING + DESKTOP_MISSING))
          if [ "$TOTAL_MISSING" -ne 0 ]; then
            echo "::error::$TOTAL_MISSING expected asset(s) missing — refusing to upload a partial release"
            exit 1
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Pushing a tag does NOT auto-create a Release object on GitHub
          # (the web UI's "create release from tag" is a separate step).
          # gh release upload requires the Release to pre-exist, so we
          # use gh release create with positional asset args to do both
          # in one call. --generate-notes auto-builds the notes from the
          # commit history between this tag and the previous release.
          #
          # On re-runs of the same tag (manual retry after a partial
          # failure) the Release already exists; gh release create fails
          # in that case and we fall back to upload --clobber.
          if gh release create "${GITHUB_REF_NAME}" \
              release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --generate-notes \
              --verify-tag 2>/dev/null; then
            echo "Created new release ${GITHUB_REF_NAME}"
          else
            echo "Release ${GITHUB_REF_NAME} already exists; uploading assets"
            gh release upload "${GITHUB_REF_NAME}" \
              release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          fi
