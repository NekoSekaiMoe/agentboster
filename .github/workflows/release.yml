# Unified release pipeline for agentboster's pre-built artifacts.
#
# Triggered by pushing a tag matching `v*` (e.g. `v0.1.0`). The tag name
# is the version shared across all components — there is one release per
# version with all artifacts attached, rather than per-component tags.
#
# What gets built (all in parallel, then collected by the `release` job):
#
#   agentd-a11y-helper-linux-amd64-<version>   (from subpackage/dbushelper, native)
#   agentd-a11y-helper-linux-arm64-<version>   (from subpackage/dbushelper, native)
#   agentd-linux-amd64-<version>              (from subpackage/agentd, native)
#   agentd-linux-arm64-<version>              (from subpackage/agentd, native)
#   agentboster-cli-<version>.tar.gz          (from subpackage/cli, OS-agnostic)
#
# All Go binaries are built on native runners (ubuntu-latest for amd64,
# ubuntu-24.04-arm for arm64) rather than cross-compiled. The build
# itself doubles as a per-arch smoke test (we exec the binary right
# after building), and each binary benefits from native toolchain
# behavior. godbus and agentd's Go deps are pure Go, so CGO stays at
# default — no C toolchain coupling.
#
# cli produces a single tarball (Node bundle, OS-agnostic) so it builds
# once on ubuntu-latest.
#
# This workflow is intentionally narrow: it builds and uploads release
# artifacts only. It does NOT run lint, tests, or any other CI step.
# Re-enabling releases does not imply re-enabling CI for the rest of the
# repo (which was turned off in commit 7583d49).

name: release

on:
  push:
    tags:
      - 'v*'
  # Manual runs verify the pipeline without tagging. The release-upload
  # step is guarded so manual runs only build, never upload.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label (e.g. v0.1.0-test). Used in asset names only; does NOT create or upload to a release.'
        required: false
        default: 'v0.1.0-dev'

permissions:
  contents: write   # required by gh release upload

jobs:
  # ── a11y-helper: native build on per-arch runners ────────────────

  a11y-helper:
    name: a11y-helper (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goarch: amd64
            asset_arch: amd64
          - runner: ubuntu-24.04-arm
            goarch: arm64
            asset_arch: arm64
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache-dependency-path: subpackage/dbushelper/go.sum

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify native arch matches
        env:
          EXPECTED: ${{ matrix.goarch }}
        run: |
          ACTUAL="$(go env GOARCH)"
          echo "go env GOARCH = $ACTUAL, expected $EXPECTED"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Runner GOARCH ($ACTUAL) does not match matrix ($EXPECTED)"
            exit 1
          fi

      - name: Build
        working-directory: subpackage/dbushelper
        env:
          CGO_ENABLED: '0'
          GOOS: linux
        run: |
          mkdir -p ../../out
          go build -trimpath -ldflags="-s -w" \
            -o "../../out/agentd-a11y-helper-linux-${{ matrix.asset_arch }}-${{ steps.ver.outputs.version }}" \
            ./cmd/a11y-helper
          # Native smoke test: --help must exit 0 on every arch.
          "../../out/agentd-a11y-helper-linux-${{ matrix.asset_arch }}-${{ steps.ver.outputs.version }}" --help

      - uses: actions/upload-artifact@v7
        with:
          name: agentd-a11y-helper-linux-${{ matrix.asset_arch }}-${{ steps.ver.outputs.version }}
          path: out/agentd-a11y-helper-linux-${{ matrix.asset_arch }}-${{ steps.ver.outputs.version }}
          retention-days: 14
          if-no-files-found: error

  # ── agentd: native build on per-arch runners ──────────────────────

  agentd:
    name: agentd (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goarch: amd64
            asset_arch: amd64
          - runner: ubuntu-24.04-arm
            goarch: arm64
            asset_arch: arm64
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache-dependency-path: subpackage/agentd/go.sum

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify native arch matches
        env:
          EXPECTED: ${{ matrix.goarch }}
        run: |
          ACTUAL="$(go env GOARCH)"
          echo "go env GOARCH = $ACTUAL, expected $EXPECTED"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Runner GOARCH ($ACTUAL) does not match matrix ($EXPECTED)"
            exit 1
          fi

      - name: Build
        working-directory: subpackage/agentd
        env:
          # agentd is Linux-only (//go:build linux). CGO is not used but
          # we leave the default so the runner's C toolchain is available
          # if a future dependency adds cgo.
          GOOS: linux
        run: |
          mkdir -p ../../out
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          go build -trimpath \
            -ldflags="-s -w -X main.version=${{ steps.ver.outputs.version }} -X main.buildTime=${BUILD_TIME}" \
            -o "../../out/agentd-linux-${{ matrix.asset_arch }}-${{ steps.ver.outputs.version }}" \
            ./cmd/agentd
          # Native smoke test: -gen-certs writes to a temp dir and exits
          # 0 without needing a config file. Verifies the binary actually
          # runs on this arch.
          cd ../../out
          "./agentd-linux-${{ matrix.asset_arch }}-${{ steps.ver.outputs.version }}" -gen-certs -cert-dir /tmp/agentd-certs-test

      - uses: actions/upload-artifact@v7
        with:
          name: agentd-linux-${{ matrix.asset_arch }}-${{ steps.ver.outputs.version }}
          path: out/agentd-linux-${{ matrix.asset_arch }}-${{ steps.ver.outputs.version }}
          retention-days: 14
          if-no-files-found: error

  # ── cli: single tarball (Node bundle is OS-agnostic) ──────────────

  cli:
    name: cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          # cli/AGENTS.md pins engines.node >=22.19.0. setup-node's
          # node-version is the runner's Node binary used for yarn.
          node-version: '22'
          cache: yarn
          cache-dependency-path: subpackage/cli/yarn.lock

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install
        working-directory: subpackage/cli
        run: yarn install --frozen-lockfile

      - name: Build
        working-directory: subpackage/cli
        run: yarn build

      - name: Bundle
        working-directory: subpackage/cli
        run: yarn bundle

      - name: Package
        working-directory: subpackage/cli
        env:
          # package.mjs reads this to name the tarball; falls back to
          # packages/coding-agent/package.json's version when unset.
          # Tagged releases carry the tag name (e.g. v0.1.3) so the
          # asset is agentboster-cli-v0.1.3.tar.gz rather than the
          # hardcoded 0.1.0 from package.json.
          AGENTBOSTER_CLI_VERSION: ${{ steps.ver.outputs.version }}
        run: yarn package

      - name: Locate tarball
        id: tarball
        working-directory: subpackage/cli
        run: |
          TARBALL=$(ls -1 agentboster-cli-*.tar.gz | head -1)
          if [ -z "$TARBALL" ]; then
            echo "::error::No agentboster-cli-*.tar.gz found after yarn package"
            exit 1
          fi
          mkdir -p ../../out
          cp "$TARBALL" "../../out/$TARBALL"
          echo "name=$TARBALL" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.tarball.outputs.name }}
          path: out/${{ steps.tarball.outputs.name }}
          retention-days: 14
          if-no-files-found: error

  # ── release: collect all artifacts, attach to the GitHub release ──

  release:
    name: attach to release
    needs: [a11y-helper, agentd, cli]
    runs-on: ubuntu-latest
    # Only attach when triggered by a real tag push. workflow_dispatch
    # runs verify the pipeline but must not pollute any release with
    # dev-labeled artifacts.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        id: ver
        run: |
          VERSION="${GITHUB_REF_NAME}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          # Match every artifact produced by the build jobs. The pattern
          # is intentionally broad — we want the release to fail loudly
          # if any expected asset is missing.
          path: release-assets
          # merge-multiple flattens the per-artifact subdirectories that
          # download-artifact v4+ creates by default. Without this, the
          # layout is release-assets/<artifact-name>/<file> and our
          # subsequent verifications would need to know each subdir name.
          # With it, every file lands directly in release-assets/.
          merge-multiple: true

      - name: Verify expected assets present
        run: |
          chmod +x release-assets/agentd-* || true

          echo "=== Collected release assets ==="
          ls -la release-assets/

          EXPECTED=(
            "agentd-a11y-helper-linux-amd64-${{ steps.ver.outputs.version }}"
            "agentd-a11y-helper-linux-arm64-${{ steps.ver.outputs.version }}"
            "agentd-linux-amd64-${{ steps.ver.outputs.version }}"
            "agentd-linux-arm64-${{ steps.ver.outputs.version }}"
            "agentboster-cli-${{ steps.ver.outputs.version }}.tar.gz"
          )
          MISSING=0
          for ASSET in "${EXPECTED[@]}"; do
            if [ ! -e "release-assets/$ASSET" ]; then
              echo "::error::Missing release asset: $ASSET"
              MISSING=$((MISSING + 1))
            fi
          done
          if [ "$MISSING" -ne 0 ]; then
            echo "::error::$MISSING expected asset(s) missing — refusing to upload a partial release"
            exit 1
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Pushing a tag does NOT auto-create a Release object on GitHub
          # (the web UI's "create release from tag" is a separate step).
          # gh release upload requires the Release to pre-exist, so we
          # use gh release create with positional asset args to do both
          # in one call. --generate-notes auto-builds the notes from the
          # commit history between this tag and the previous release.
          #
          # On re-runs of the same tag (manual retry after a partial
          # failure) the Release already exists; gh release create fails
          # in that case and we fall back to upload --clobber.
          if gh release create "${GITHUB_REF_NAME}" \
              release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --generate-notes \
              --verify-tag 2>/dev/null; then
            echo "Created new release ${GITHUB_REF_NAME}"
          else
            echo "Release ${GITHUB_REF_NAME} already exists; uploading assets"
            gh release upload "${GITHUB_REF_NAME}" \
              release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          fi
