# Go CI for agentd (the sandboxed execution daemon) and dbushelper
# (the pure-Go AT-SPI2 D-Bus client consumed by agentd's tools_a11y.go).
#
# Both subprojects are Linux-only at build time — agentd's source files
# carry `//go:build linux` so they don't compile on macOS/Windows, and
# dbushelper's only meaningful tests exercise AT-SPI2 over the D-Bus
# session bus (Linux-only). We therefore run everything on Ubuntu and
# skip the cross-platform matrix the TS/Rust workflows use.
#
# Path-scoped per subproject at the trigger level so a PR touching
# only agentd doesn't waste a runner on dbushelper and vice versa.
# Per-job `if:` conditions would be unreliable (the changed-files
# payload isn't always populated), so the trigger filter is the
# source of truth — but since both paths are listed at the top,
# either subproject's change runs BOTH jobs. The trade-off (a few
# extra seconds when only one subproject changed) is worth the
# simpler, harder-to-break configuration.

name: go-ci

on:
  push:
    branches: [main]
    paths:
      - 'subpackage/agentd/**'
      - 'subpackage/dbushelper/**'
      - '.github/workflows/go-ci.yml'
  pull_request:
    paths:
      - 'subpackage/agentd/**'
      - 'subpackage/dbushelper/**'
      - '.github/workflows/go-ci.yml'

permissions:
  contents: read

jobs:
  agentd:
    name: agentd (vet + build + test)
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: subpackage/agentd

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: subpackage/agentd/go.mod
          cache-dependency-path: subpackage/agentd/go.sum

      # agentd has CGO bindings for a few native libraries (sandbox
      # runtime, AT-SPI2 access via the bundled a11y-helper). The
      # dev-libs/libxml2 dev header is required to build the cgo bits
      # in some configurations; install the standard set so a missing
      # header doesn't randomly fail CI.
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libdbus-1-dev \
            libatspi2.0-dev \
            libclang-dev

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./...

  dbushelper:
    name: dbushelper (vet + build + test)
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: subpackage/dbushelper

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: subpackage/dbushelper/go.mod
          cache-dependency-path: subpackage/dbushelper/go.sum

      # dbushelper's CLI e2e tests (conn_unix_test.go) build the
      # a11y-helper binary as a subprocess, so we need the AT-SPI2
      # dev headers at test time as well.
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libdbus-1-dev \
            libatspi2.0-dev

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        # The dbushelper test suite includes both pure unit tests and
        # CLI e2e tests that build a11y-helper as a subprocess. The
        # e2e tests skip themselves if `go` is not on PATH; on CI it
        # is, so they will run.
        run: go test ./...
